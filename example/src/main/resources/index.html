    <script type="text/javascript">
        //      bytes.push(0)//text flag
        function concatenate(msg, msgType, session_key) {
            msgType = [msgType, session_key];
            let totalLength = (msg.length ? msg.length : msg.byteLength) + 1;
            let result = new Uint8Array(totalLength);
            result.set(msgType, 0);
            result.set(msg, 1);
            return result;
        }

        Array.prototype.toUint8Array = function () {
            bytes = this;
            var array = new Uint8Array(bytes.length + 1);
            for (i = 0; i < array.length; i++) {
                array[i] = bytes[i];
            }
            return array;
        }

        String.prototype.toArray = function () {
            var bytes = [];
            var len, c;
            len = this.length;
            for (var i = 0; i < len; i++) {
                c = this.charCodeAt(i);
                if (c >= 0x010000 && c <= 0x10FFFF) {
                    bytes.push(((c >> 18) & 0x07) | 0xF0);
                    bytes.push(((c >> 12) & 0x3F) | 0x80);
                    bytes.push(((c >> 6) & 0x3F) | 0x80);
                    bytes.push((c & 0x3F) | 0x80);
                } else if (c >= 0x000800 && c <= 0x00FFFF) {
                    bytes.push(((c >> 12) & 0x0F) | 0xE0);
                    bytes.push(((c >> 6) & 0x3F) | 0x80);
                    bytes.push((c & 0x3F) | 0x80);
                } else if (c >= 0x000080 && c <= 0x0007FF) {
                    bytes.push(((c >> 6) & 0x1F) | 0xC0);
                    bytes.push((c & 0x3F) | 0x80);
                } else {
                    bytes.push(c & 0xFF);
                }
            }
            return bytes;
        };

        Uint8Array.prototype.toString = function () {
            /**
             * https://www.javascripture.com/DataView
             * DataViews allow heterogeneous access to data stored in an ArrayBuffer. Values can be read and stored at any byte offset without alignment constraints.
             * @type {DataView}
             */
            var dataView = new DataView(this.buffer);
            var ints = new Uint8Array(this.buffer.byteLength);
            for (var i = 0; i < ints.length; i++) {
                ints[i] = dataView.getUint8(i);
            }
            var str = '', _arr = ints;
            for (var i = 0; i < _arr.length; i++) {
                var one = _arr[i].toString(2),
                    v = one.match(/^1+?(?=0)/);
                if (v && one.length == 8) {
                    var bytesLength = v[0].length;
                    var store = _arr[i].toString(2).slice(7 - bytesLength);
                    for (var st = 1; st < bytesLength; st++) {
                        store += _arr[st + i].toString(2).slice(2);
                    }
                    str += String.fromCharCode(parseInt(store, 2));
                    i += bytesLength - 1;
                } else {
                    str += String.fromCharCode(_arr[i]);
                }
            }
            return str;
        };
    </script>
    <script type="text/javascript">


        //sec-websocket-protocol
        //https://www.cnblogs.com/huic/p/15878201.html
        var userId = "user" + Math.floor(Math.random() * 100);
        console.log("current user" + userId)
        var ws = new WebSocket("ws://127.0.0.1:8080/websocket", [userId]);
        //申请一个WebSocket对象，参数是服务端地址，同http协议使用http://开头一样，WebSocket协议的url使用ws://开头，另外安全的WebSocket协议使用wss://开头
        ws.onopen = function () {
            //当WebSocket创建成功时，触发onopen事件
            console.log("open");
        }
        ws.onmessage = function (e) {
            //当客户端收到服务端发来的消息时，触发onmessage事件，参数e.data包含server传递过来的数据
            if (e.data instanceof Blob) {

                (async () => {
                    const blob = e.data;
                    const buf = await blob.arrayBuffer();
                    console.log(buf.byteLength);

                    var dataView = new DataView(buf);

                    var flag = dataView.getUint8(0);
                    if (flag == 0) {
                        const newBf = buf.slice(1, buf.byteLength);
                        const chars = new Uint8Array(newBf);
                        console.log(chars);
                        console.log(chars.toString());
                        return
                    }
                    if (flag == 1) {
                        const img = document.getElementById('img');
                        const newBf = buf.slice(1, buf.byteLength);
                        fileBlob = new Blob([newBf]);
                        //本地直接读即可
                        //const url = window.URL.createObjectURL(file);

                        const url = window.URL.createObjectURL(fileBlob);
                        img.src = url;
                        img.onload = function () {

                            // 释放一个之前通过调用 URL.createObjectURL创建的 URL 对象
                            window.URL.revokeObjectURL(url);
                        }
                    }

                })();


                // const reader = new FileReader();
                // reader.readAsText(e.data, "UTF-8");
                // reader.onload = (e) => {
                //   //字符串和json格式e
                //   result = reader.result;
                //   console.log('websocked收到', result);
                // }
            }
        }
        ws.onclose = function (e) {
            //当客户端收到服务端发送的关闭连接请求时，触发onclose事件
            console.log("close");
        }
        ws.onerror = function (e) {
            //如果出现连接、处理、接收、发送数据失败的时候触发onerror事件
            console.log(e);
        }

        function sendMessage() {
            msg = document.getElementById("txtMessage").value;
            ws.send(concatenate(msg.toArray().toUint8Array(), 0)); //将消息发送到服务端
        }

        function sendPicture(src) {
            const file = src.files[0];
            const fileReader = new FileReader();
            fileReader.onload = function () {
                const result = fileReader.result;
                console.log(result);
                ws.send(concatenate(new Uint8Array(result), 1)); //将消息发送到服务端
            }
            fileReader.readAsArrayBuffer(file);
        }
    </script>
